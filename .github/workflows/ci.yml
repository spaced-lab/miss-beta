# WHAT: CI for every push and pull request (GAME_PLAN 26.3): typecheck, vitest, pytest, lore validation,
#       the production build, a smoke test against the built site, and a Pages deploy from main.
# WHY:  The repo is a course: a red main teaches the wrong thing.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s pymiss/tests -t . -q
      - run: python3 scripts/build_lore.py --check
      - run: python3 scripts/gen_vectors.py > /dev/null && git diff --quiet -- tests/vectors
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 scripts/build_lore.py && npm run build
      - run: node scripts/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # NOTE: skipped while the repository is private (the review stage before the first public publish): a free
  # organization cannot serve Pages from a private repository, so the job would only fail and turn main red.
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
