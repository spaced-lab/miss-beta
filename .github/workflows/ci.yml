# WHAT: CI for every push and pull request (GAME_PLAN 26.3): typecheck, vitest, pytest, lore validation,
#       the production build, a smoke test against the built site, and a Pages deploy from main.
# WHY:  The repo is a course: a red main teaches the wrong thing.
# NOTE: actions are pinned by commit SHA, as in release.yml (the deploy job holds pages: write and id-token).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# NOTE: least privilege. The workflow default is read-only; only the deploy job (main, public repository) gets
# pages: write and id-token: write, so no pull-request run, fork or same-repository branch, ever holds them.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # NOTE: one Node major for CI and contributors (.nvmrc). The planar replay is exact only on the runtime
          # that captured it and allows 1e-8 relative drift elsewhere (tests/planarReplay.test.ts).
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      # NOTE: the same gate as `npm run check` locally (typecheck, tests, pymiss, lore, vectors, npm audit of every
      # dependency at moderate, and the static security greps), so nothing ships that the gate would refuse.
      - run: bash scripts/check.sh
      - run: python3 scripts/build_lore.py && npm run build
      - run: node scripts/smoke.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  # NOTE: skipped while the repository is private (the review stage before the first public publish): a free
  # organization cannot serve Pages from a private repository, so the job would only fail and turn main red.
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
