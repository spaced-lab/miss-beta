# WHAT: The release pipeline for a version tag (vYY.Q.N): the full check, the production build, a zip with
#       SHA256SUMS, a keyless build-provenance attestation, a GitHub Release, and a Pages deploy of that build.
# WHY:  Checksums and signatures without a personal signing key (docs/RELEASING.md): the attestation is signed
#       through Sigstore with this run's short-lived OIDC identity, so it proves "this zip came from this commit,
#       built by this workflow in spaced-lab/miss-beta". Immutable releases (repository setting) lock the tag and
#       the assets once published. Verify a download with:
#         gh attestation verify miss-beta-<version>.zip -R spaced-lab/miss-beta
# HOW:  build (read-only) -> release (contents, id-token, attestations) -> deploy (pages, id-token). Artifact
#       attestations need a public repository on GitHub's free plans, so the first run is the v26.4.0 tag after
#       the repository goes public.
# NOTE: every action is pinned by commit SHA (the tag in the comment is the major it came from): a retagged or
#       compromised action cannot run inside jobs that create releases and mint provenance (code review
#       2026-10-18). To update, resolve the new tag with `gh api repos/<owner>/<action>/commits/<tag> --jq .sha`.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.newest.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # NOTE: deploy only a tag that contains all of main. An older tag (a re-run of an old release, or a hotfix tag
      # behind main) still gets its release, but Pages keeps main's newer build instead of rolling back.
      - id: newest
        name: Is this tag at or ahead of main?
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor origin/main HEAD; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::tag is behind main: release only, no Pages deploy"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        name: Tag must match package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          # Only a plain YY.Q.N version goes any further (it names files and ends up in shell lines and URLs).
          if ! printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "package.json version is not YY.Q.N"; exit 1; fi
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then echo "tag ${GITHUB_REF_NAME} does not match package.json ${v}"; exit 1; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # NOTE: the same gate as `npm run check` locally (typecheck, tests, pymiss, lore, vectors, npm audit of every
      # dependency at moderate, and the static security greps), so nothing ships that the gate would refuse.
      - run: bash scripts/check.sh
      - run: python3 scripts/build_lore.py && npm run build
      - run: node scripts/smoke.mjs
      - name: Zip, checksums and release notes
        # NOTE: values reach the script through env:, never pasted into it with ${{ }} (template injection).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v="${VERSION}"
          mkdir -p release
          (cd dist && zip -qrX "../release/miss-beta-${v}.zip" .)
          (cd release && sha256sum "miss-beta-${v}.zip" > SHA256SUMS && cat SHA256SUMS)
          # The CHANGELOG section for this version, from its dated heading `## YY.Q.N (YYYY-MM-DD)` to the next one.
          # NOTE: only the dated form counts, so an `(unreleased: ...)` heading or a section of blank lines stops
          # the run here: an immutable release cannot have its notes fixed afterwards.
          awk -v v="${v}" 'index($0, "## " v " (") == 1 && $0 ~ /^## [^ ]+ \([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)[ \t]*$/ {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > release/NOTES.md
          grep -q '[^[:space:]]' release/NOTES.md || { echo "CHANGELOG.md has no dated '## ${v} (YYYY-MM-DD)' section with notes"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/miss-beta-${{ needs.build.outputs.version }}.zip
      # NOTE: created with its assets in one call, so an immutable release is complete the moment it exists.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "MISS β ${v}" \
            --notes-file release/NOTES.md "release/miss-beta-${v}.zip" release/SHA256SUMS
  deploy:
    needs: [build, release]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # NOTE: shared with ci.yml's deploy job so a main deploy and a release deploy never overlap. The github-pages
    # environment must allow tags v* (Settings > Environments), or this deploy is refused (docs/RELEASING.md).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
